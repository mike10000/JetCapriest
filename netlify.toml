# Netlify Configuration for First Sunday Music

[build]
  publish = "."

# First Sunday is the site home; legacy paths redirect to /
[[redirects]]
  from = "/first-sunday"
  to = "/"
  status = 301

[[redirects]]
  from = "/first-sunday.html"
  to = "/"
  status = 301

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
