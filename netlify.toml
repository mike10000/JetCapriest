# Netlify Configuration for First Sunday Music

[build]
  publish = "."

# First Sunday is the site home; legacy paths redirect to /
[[redirects]]
  from = "/first-sunday"
  to = "/"
  status = 301

[[redirects]]
  from = "/first-sunday.html"
  to = "/"
  status = 301

# Long cache for media; JS/CSS revalidate so updates (e.g. shows) ship quickly
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
